# Agrega la GPU NVIDIA a Ollama. Requiere el NVIDIA Container Toolkit en el servidor.
#   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d --build
services:
  ollama:
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
  api:
    environment:
      MAX_CONCURRENT_JOBS: ${MAX_CONCURRENT_JOBS:-2}
