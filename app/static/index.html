<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>INE OCR · Prueba</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1b1f24; --muted: #667085; --line: #e4e7ec;
    --accent: #2f5bea; --ok: #12805c; --ok-bg: #e6f4ee; --warn: #9a6100; --warn-bg: #fdf3e1;
    --bad: #b42318; --bad-bg: #fdecea; --mono: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --panel: #1a1e24; --text: #e6e8eb; --muted: #98a2b3; --line: #2b313a;
      --accent: #7b9bff; --ok: #4ccf9a; --ok-bg: #12301f; --warn: #f0b44c; --warn-bg: #33270f;
      --bad: #ff8a80; --bad-bg: #3a1716; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text); }
  header { padding: 18px 24px; border-bottom: 1px solid var(--line); background: var(--panel);
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  header h1 { font-size: 17px; margin: 0; }
  header .model { color: var(--muted); font-size: 13px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; background: var(--muted); }
  .dot.on { background: var(--ok); } .dot.off { background: var(--bad); }
  main { max-width: 1280px; margin: 0 auto; padding: 20px 16px 60px; }
  .drop { display: block; border: 2px dashed var(--line); border-radius: 12px; background: var(--panel); padding: 28px;
    text-align: center; cursor: pointer; transition: border-color .15s, background .15s; }
  .drop.over { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 6%, var(--panel)); }
  .drop strong { display: block; font-size: 15px; margin-bottom: 4px; }
  .drop small { color: var(--muted); }
  .opts { margin-top: 10px; color: var(--muted); font-size: 13px; display: flex; gap: 18px;
    justify-content: center; flex-wrap: wrap; }
  .queue { margin-top: 14px; display: flex; gap: 8px; flex-wrap: wrap; }
  .chip { border: 1px solid var(--line); background: var(--panel); border-radius: 999px; padding: 5px 12px;
    font-size: 13px; cursor: pointer; display: flex; align-items: center; gap: 6px; color: var(--text); }
  .chip.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .badge { font-size: 12px; font-weight: 600; padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
  .b-ok, .b-alta { background: var(--ok-bg); color: var(--ok); }
  .b-revisar, .b-media { background: var(--warn-bg); color: var(--warn); }
  .b-error, .b-baja, .b-falla { background: var(--bad-bg); color: var(--bad); }
  .b-wait { background: var(--line); color: var(--muted); }
  .b-no_aplica { background: var(--line); color: var(--muted); }
  .result { margin-top: 18px; display: none; }
  .summary { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; background: var(--panel);
    border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .summary .name { font-size: 16px; font-weight: 600; }
  .summary .meta { color: var(--muted); font-size: 13px; margin-left: auto; }
  .alerts { margin-top: 10px; display: grid; gap: 6px; }
  .alert { border-radius: 8px; padding: 8px 12px; font-size: 13px; }
  .grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; margin-top: 16px; }
  @media (max-width: 900px) { .grid { grid-template-columns: 1fr; } }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; }
  .card h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted);
    margin: 0 0 10px; font-weight: 600; }
  .crops img { width: 100%; border-radius: 8px; border: 1px solid var(--line); display: block;
    margin-bottom: 10px; background: #fff; }
  .crops .lbl { font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  table { width: 100%; border-collapse: collapse; }
  td { padding: 7px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  tr:last-child td { border-bottom: 0; }
  td.k { color: var(--muted); width: 34%; font-size: 13px; }
  td.v { font-family: var(--mono); font-size: 13px; word-break: break-word; }
  td.v.plain { font-family: inherit; }
  td.c { width: 1%; text-align: right; }
  .copy { background: none; border: 0; color: var(--muted); cursor: pointer; font-size: 12px; padding: 0 0 0 6px; }
  .copy:hover { color: var(--accent); }
  .section-row td { padding-top: 14px; font-size: 12px; font-weight: 600; color: var(--muted);
    text-transform: uppercase; letter-spacing: .04em; border-bottom: 1px solid var(--line); }
  details { margin-top: 16px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; padding: 4px 0; }
  pre { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 12px; overflow: auto;
    font: 12px/1.5 var(--mono); max-height: 520px; }
  .val td { font-size: 13px; }
  .val td.d { color: var(--muted); font-family: var(--mono); font-size: 12px; }
  .spinner { width: 16px; height: 16px; border: 2px solid var(--line); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .8s linear infinite; display: inline-block; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .empty { color: var(--muted); text-align: center; padding: 30px; }
  .btn { border: 1px solid var(--line); background: var(--panel); color: var(--text); border-radius: 8px;
    padding: 6px 12px; cursor: pointer; font-size: 13px; }
  .btn:hover { border-color: var(--accent); }
</style>
</head>
<body>
<header>
  <h1>INE OCR · Prueba</h1>
  <span class="model"><span id="dot" class="dot"></span> <span id="health">verificando…</span></span>
  <input id="apikey" type="password" placeholder="API key (si el servidor la pide)" autocomplete="off"
    style="margin-left:auto; border:1px solid var(--line); background:var(--bg); color:var(--text);
    border-radius:8px; padding:6px 10px; font-size:13px; width:240px; max-width:100%">
</header>
<main>
  <label class="drop" id="drop">
    <input type="file" id="file" accept=".pdf,image/*" multiple hidden>
    <strong>Arrastra aquí uno o varios PDF / imágenes de INE</strong>
    <small>o haz clic para elegir · se procesan uno por uno, en tu equipo</small>
  </label>
  <div class="opts">
    <label><input type="checkbox" id="pair"> Anverso y reverso vienen en 2 archivos separados (elige los 2 a la vez)</label>
  </div>
  <div class="queue" id="queue"></div>

  <details class="card" id="histCard" style="display:none; margin-top:16px">
    <summary style="font-size:13px; font-weight:600">Historial (base de datos)</summary>
    <div style="display:flex; gap:8px; margin:10px 0; flex-wrap:wrap">
      <input id="histQ" placeholder="Buscar nombre o archivo" class="btn" style="flex:1; min-width:180px; cursor:text">
      <select id="histEstado" class="btn">
        <option value="">Todos</option><option value="ok">ok</option><option value="revisar">revisar</option>
        <option value="revisado">revisado</option><option value="error">error</option>
      </select>
      <button class="btn" id="histBtn">Actualizar</button>
    </div>
    <div style="overflow-x:auto"><table id="histTable"></table></div>
  </details>

  <div class="result" id="result">
    <div class="summary" id="summary"></div>
    <div class="alerts" id="alerts"></div>
    <div class="grid">
      <div class="card crops"><h2>Recortes detectados</h2><div id="crops"></div></div>
      <div class="card"><h2>Datos extraídos</h2><table id="fields"></table></div>
    </div>
    <div class="card" style="margin-top:16px">
      <h2>Validaciones</h2>
      <table class="val" id="checks"></table>
    </div>
    <details>
      <summary>JSON completo</summary>
      <div style="margin:8px 0"><button class="btn" id="copyJson">Copiar JSON</button>
        <button class="btn" id="dlJson">Descargar JSON</button></div>
      <pre id="json"></pre>
    </details>
  </div>
</main>

<script>
const $ = (id) => document.getElementById(id);
const items = [];   // {name, status, data, error}
let current = -1;
let busy = false;

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

async function health() {
  try {
    const r = await fetch("/health"); const h = await r.json();
    if (h.base_de_datos) { $("histCard").style.display = "block"; loadHistory(); }
    $("dot").className = "dot " + (h.vlm ? "on" : "off");
    $("health").textContent = `${h.modelo_vlm} (${h.backend_vlm}) · ${h.vlm ? "listo" : "el modelo no responde"}`;
  } catch { $("dot").className = "dot off"; $("health").textContent = "API no disponible"; }
}
health();
try { $("apikey").value = sessionStorage.getItem("ine_api_key") || ""; } catch {}
$("apikey").addEventListener("input", e => { try { sessionStorage.setItem("ine_api_key", e.target.value); } catch {} });

const drop = $("drop");
["dragenter", "dragover"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.add("over"); }));
["dragleave", "drop"].forEach(e => drop.addEventListener(e, ev => { ev.preventDefault(); drop.classList.remove("over"); }));
drop.addEventListener("drop", ev => enqueue([...ev.dataTransfer.files]));
$("file").addEventListener("change", ev => { enqueue([...ev.target.files]); ev.target.value = ""; });

function enqueue(files) {
  if (!files.length) return;
  if ($("pair").checked && files.length === 2) {
    items.push({ name: files[0].name + " + " + files[1].name, files, status: "wait" });
  } else {
    files.forEach(f => items.push({ name: f.name, files: [f], status: "wait" }));
  }
  renderQueue(); run();
}

function renderQueue() {
  $("queue").innerHTML = items.map((it, i) => {
    const b = it.status === "wait" ? `<span class="badge b-wait">en cola</span>`
      : it.status === "run" ? `<span class="spinner"></span>`
      : `<span class="badge b-${it.status}">${it.status}</span>`;
    return `<button class="chip ${i === current ? "active" : ""}" data-i="${i}">${esc(it.name)} ${b}</button>`;
  }).join("");
  $("queue").querySelectorAll(".chip").forEach(el => el.onclick = () => { const i = +el.dataset.i; if (items[i].data || items[i].error) show(i); });
}

async function run() {
  if (busy) return;
  const i = items.findIndex(it => it.status === "wait");
  if (i < 0) return;
  busy = true; items[i].status = "run"; renderQueue();
  const fd = new FormData();
  fd.append("archivo", items[i].files[0]);
  if (items[i].files[1]) fd.append("reverso", items[i].files[1]);
  const t0 = performance.now();
  try {
    const key = $("apikey").value.trim();
    const r = await fetch("/v1/ine/extraer?incluir_recortes=true",
      { method: "POST", body: fd, headers: key ? { "X-API-Key": key } : {} });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    items[i].data = data; items[i].status = data.estado;
  } catch (e) {
    items[i].error = e.message; items[i].status = "error";
  }
  items[i].secs = ((performance.now() - t0) / 1000).toFixed(1);
  busy = false; show(i); run();
  if ($("histCard").style.display !== "none") loadHistory();
}

const CONF_OF = { apellido_paterno: "nombre", apellido_materno: "nombre", nombres: "nombre",
  domicilio: "domicilio", calle: "domicilio", colonia: "domicilio", codigo_postal: "domicilio",
  municipio: "domicilio", estado_dom: "domicilio", vigencia: "vigencia", anio_registro: "anio_registro",
  identificador_ciudadano: "identificador_ciudadano", numero_ocr: "identificador_ciudadano" };

function authHeaders() {
  const key = $("apikey").value.trim();
  return key ? { "X-API-Key": key } : {};
}

async function loadHistory() {
  const p = new URLSearchParams({ limite: "30" });
  if ($("histQ").value.trim()) p.set("q", $("histQ").value.trim());
  if ($("histEstado").value) p.set("estado", $("histEstado").value);
  try {
    const r = await fetch("/v1/ine/extracciones?" + p, { headers: authHeaders() });
    const data = await r.json();
    if (!r.ok) throw new Error(data.detail || r.statusText);
    $("histTable").innerHTML = data.elementos.length ? data.elementos.map(e => `
      <tr style="cursor:pointer" data-id="${esc(e.id)}">
        <td style="white-space:nowrap; color:var(--muted); font-size:12px">${esc(new Date(e.creado).toLocaleString())}</td>
        <td><span class="badge b-${e.estado === "revisado" ? "ok" : e.estado}">${esc(e.estado)}</span></td>
        <td>${esc(e.nombre_completo || "—")}</td>
        <td class="v" style="font-family:var(--mono); font-size:12px">${esc(e.curp || "")}</td>
        <td style="color:var(--muted); font-size:12px">${esc(e.archivo || "")}</td>
      </tr>`).join("") + `<tr><td colspan="5" style="color:var(--muted); font-size:12px">${data.total} en total</td></tr>`
      : `<tr><td class="empty">Sin resultados</td></tr>`;
    $("histTable").querySelectorAll("tr[data-id]").forEach(tr => tr.onclick = () => openHistory(tr.dataset.id));
  } catch (e) {
    $("histTable").innerHTML = `<tr><td class="empty">${esc(e.message)}</td></tr>`;
  }
}

async function openHistory(id) {
  const r = await fetch("/v1/ine/extracciones/" + encodeURIComponent(id), { headers: authHeaders() });
  const det = await r.json();
  if (!r.ok) return alert(det.detail || r.statusText);
  items.push({ name: det.archivo || det.id, status: det.estado === "revisado" ? "ok" : det.estado,
               data: { ...det.resultado, id: det.id }, secs: ((det.tiempo_ms || 0) / 1000).toFixed(1) });
  show(items.length - 1);
}

$("histBtn").onclick = loadHistory;
$("histQ").addEventListener("keydown", e => { if (e.key === "Enter") loadHistory(); });
$("histEstado").onchange = loadHistory;

function show(i) {
  current = i; renderQueue();
  const it = items[i];
  $("result").style.display = "block";
  if (it.error) {
    $("summary").innerHTML = `<span class="badge b-error">error</span><span class="name">${esc(it.name)}</span>`;
    $("alerts").innerHTML = `<div class="alert b-error">${esc(it.error)}</div>`;
    ["crops", "fields", "checks", "json"].forEach(id => $(id).innerHTML = "");
    return;
  }
  const r = it.data, d = r.datos, c = r.confianza || {};
  const t = r.meta?.tiempos_ms || {};
  $("summary").innerHTML = `
    <span class="badge b-${r.estado}" style="font-size:13px">${r.estado === "ok" ? "OK" : r.estado === "revisar" ? "REVISAR" : "ERROR"}</span>
    <span class="name">${esc(d.nombre?.nombre_completo || it.name)}</span>
    <span class="meta">${esc(it.name)} · ${it.secs} s · OCR ${((t.ocr_y_recorte||0)/1000).toFixed(1)} s · VLM ${((t.vlm_anverso||0)/1000).toFixed(1)} s${t.vlm_reverso ? " + " + (t.vlm_reverso/1000).toFixed(1) + " s" : ""} · MRZ vía ${esc(r.meta?.mrz_fuente || "—")}</span>`;

  const alerts = [];
  if (r.campos_a_revisar?.length) alerts.push(`<div class="alert b-baja">Revisar: <b>${r.campos_a_revisar.map(esc).join(", ")}</b></div>`);
  if (r.campos_reconstruidos?.length) alerts.push(`<div class="alert b-media">Reconstruidos a partir de otros datos: <b>${r.campos_reconstruidos.map(esc).join(", ")}</b></div>`);
  (r.advertencias || []).forEach(a => alerts.push(`<div class="alert b-media">${esc(a)}</div>`));
  $("alerts").innerHTML = alerts.join("");

  const rc = r.recortes || {};
  $("crops").innerHTML = ["anverso", "reverso"].map(s => rc[s]
    ? `<div class="lbl">${s} · ${esc(r.meta?.["recorte_" + s] || "")}</div><img alt="${s}" src="data:image/png;base64,${rc[s]}">`
    : `<div class="lbl">${s}: no detectado</div>`).join("") || `<div class="empty">Sin recortes</div>`;

  const dom = d.domicilio || {}, vig = d.vigencia || {};
  const rows = [
    ["sec", "Identidad"],
    ["Apellido paterno", d.nombre?.apellido_paterno, "nombre"],
    ["Apellido materno", d.nombre?.apellido_materno, "nombre"],
    ["Nombres", d.nombre?.nombres, "nombre"],
    ["Sexo", d.sexo, "sexo"],
    ["Fecha de nacimiento", d.fecha_nacimiento, "fecha_nacimiento"],
    ["CURP", d.curp, "curp"],
    ["Clave de elector", d.clave_elector, "clave_elector"],
    ["sec", "Domicilio"],
    ["Calle", dom.calle, "domicilio"],
    ["Colonia", dom.colonia, "domicilio"],
    ["Código postal", dom.codigo_postal, "domicilio"],
    ["Municipio", dom.municipio, "domicilio"],
    ["Estado", dom.estado, "domicilio"],
    ["sec", "Credencial"],
    ["Sección", d.seccion, "seccion"],
    ["Año de registro", [d.anio_registro, d.anio_registro_sufijo].filter(Boolean).join(" "), "anio_registro"],
    ["Vigencia", [vig.desde, vig.hasta].filter(Boolean).join(" – ") + (vig.vigente === false ? "  (vencida)" : ""), "vigencia"],
    ["Estado / municipio / localidad", [d.estado_clave, d.municipio_clave, d.localidad].filter(Boolean).join(" / "), null],
    ["Emisión", d.emision, null],
    ["Modelo", d.modelo_credencial, null],
    ["sec", "Reverso"],
    ["CIC", d.cic, "cic"],
    ["Identificador ciudadano", d.identificador_ciudadano, "identificador_ciudadano"],
    ["Número OCR", d.numero_ocr, "identificador_ciudadano"],
    ["MRZ", (d.mrz || []).join("\n"), null],
  ];
  $("fields").innerHTML = rows.map(([k, v, cf]) => {
    if (k === "sec") return `<tr class="section-row"><td colspan="3">${v}</td></tr>`;
    if ((v === null || v === undefined || v === "") && cf === null) return "";
    const conf = cf ? c[cf] : null;
    const val = v === null || v === undefined || v === "" ? `<span style="color:var(--muted)">—</span>`
      : `${esc(v).replace(/\n/g, "<br>")}<button class="copy" title="Copiar" data-v="${esc(v)}">⧉</button>`;
    return `<tr><td class="k">${k}</td><td class="v">${val}</td><td class="c">${conf ? `<span class="badge b-${conf}">${conf}</span>` : ""}</td></tr>`;
  }).join("");
  $("fields").querySelectorAll(".copy").forEach(b => b.onclick = () => navigator.clipboard?.writeText(b.dataset.v));

  const checks = (r.validaciones || []).slice().sort((a, b) => (a.resultado === "falla" ? -1 : 0) - (b.resultado === "falla" ? -1 : 0));
  $("checks").innerHTML = checks.map(v => `<tr><td><span class="badge b-${v.resultado}">${v.resultado.replace("_", " ")}</span></td>
    <td>${esc(v.regla.replace(/_/g, " "))}</td><td class="d">${esc(v.detalle || "")}</td></tr>`).join("");

  const clean = { ...r }; delete clean.recortes;
  const json = JSON.stringify(clean, null, 2);
  $("json").textContent = json;
  $("copyJson").onclick = () => navigator.clipboard?.writeText(json);
  $("dlJson").onclick = () => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], { type: "application/json" }));
    a.download = it.name.replace(/\.[^.]+$/, "") + ".json"; a.click();
  };
}
</script>
</body>
</html>
